name: photon-platform
label: iMessage via Photon
kind: platform
version: 0.4.0
description: >
  Photon 2.0 gateway adapter for Hermes Agent: iMessage through a Photon
  shared line. Inbound messages arrive on the project's Socket.IO event
  stream (no webhook, no public URL), resumed from the last handled event
  after a restart; replies go out through Photon's REST API. Both run in
  Python from the `photon` extra, with no Node sidecar.

  The plugin ships with a `hermes photon setup` CLI that connects a Photon 2.0
  project: device login, project, project API key and a shared iMessage line.
  Runtime credentials are written to ``~/.hermes/.env`` (``PHOTON_PROJECT_ID``,
  ``PHOTON_API_KEY``) like every other channel, with management metadata
  (device-login session, project and key ids) in ``~/.hermes/auth.json``.
  Setting both variables by hand skips the browser sign-in entirely.
  Photon's free shared-line model lets users get started without a paid plan.
author: NousResearch
requires_env:
  - name: PHOTON_PROJECT_ID
    description: "Photon 2.0 project id (pho_prj_...; set by `hermes photon setup`)"
    prompt: "Photon project id"
    url: "https://app.beta.photon.codes/"
    password: false
  - name: PHOTON_API_KEY
    description: "Photon 2.0 project API key (pho_sk_...; set by `hermes photon setup`)"
    prompt: "Photon project API key"
    url: "https://app.beta.photon.codes/"
    password: true
optional_env:
  - name: PHOTON_PROJECT_SECRET
    description: "Photon Spectrum project secret (before Photon 2.0); `hermes photon setup` moves it into auth.json"
    prompt: "Photon Spectrum project secret"
    password: true
  - name: PHOTON_API_HOST
    description: "Photon API host (default https://api.photon.codes)"
    prompt: "Photon API host"
    password: false
  - name: PHOTON_ALLOWED_USERS
    description: "Comma-separated E.164 phone numbers allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: PHOTON_ALLOW_ALL_USERS
    description: "Allow any sender to trigger the bot (dev only — disables allowlist)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: PHOTON_READ_RECEIPTS
    description: "Mark inbound iMessages read after forwarding to Hermes (true/false, default true)"
    prompt: "Send read receipts? (true/false)"
    password: false
  - name: PHOTON_REQUIRE_MENTION
    description: "Ignore group-chat messages unless they match a mention wake word (true/false, default false)"
    prompt: "Require a mention in group chats?"
    password: false
  - name: PHOTON_MENTION_PATTERNS
    description: "Mention wake-word regexes for group chats (JSON list or comma/newline-separated; defaults to Hermes wake words)"
    prompt: "Group mention patterns"
    password: false
  - name: PHOTON_HOME_CHANNEL
    description: "Default Photon target for cron / notification delivery: a Photon space id (pho_spc_...) or the E.164 phone number of someone who has texted your line"
    prompt: "Home Photon target"
    password: false
  - name: PHOTON_HOME_CHANNEL_NAME
    description: "Human label for the home channel"
    prompt: "Home channel display name"
    password: false
  - name: PHOTON_MARKDOWN
    description: "Send agent replies as markdown, falling back to plain text when Photon refuses it (true/false, default true)"
    prompt: "Render replies as markdown? (true/false)"
    password: false
